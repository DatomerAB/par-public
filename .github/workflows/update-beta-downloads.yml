name: Update beta downloads

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      runner_preference:
        type: choice
        default: self-hosted-preferred
        options: [self-hosted-preferred, github-hosted]
      wait_minutes:
        type: number
        default: 30

permissions:
  contents: write
  actions: write

concurrency:
  group: beta-downloads
  cancel-in-progress: false
  queue: max

jobs:
  runner-selection:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.download_catalog_url == 'https://raw.githubusercontent.com/DatomerAB/par-releases/main/downloads.json'
    uses: DatomerAB/par-releases/.github/workflows/select-runner.yml@d2839636e84e6a6816f2c7b6d8df885dbbaefbf2
    with:
      runner_preference: ${{ inputs.runner_preference || vars.RUNNER_PREFERENCE || 'self-hosted-preferred' }}
      self_hosted_labels: ${{ vars.RELEASE_CONTROLLER_LABELS || '["self-hosted","macOS","ARM64","par"]' }}
      controller_labels: ${{ vars.RELEASE_CONTROLLER_LABELS || '["self-hosted","macOS","ARM64","par"]' }}
      github_hosted_label: ubuntu-latest
      wait_minutes: ${{ fromJSON(github.event.inputs.wait_minutes || vars.RUNNER_WAIT_MINUTES || '30') }}
    secrets:
      runner_check_token: ${{ secrets.SELF_HOSTED_RUNNER_CHECK_TOKEN }}
    permissions:
      actions: read
  update:
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs_on) }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN || github.token }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Validate public catalog and update deployed fallback
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { validDownloadCatalog } from './assets/landing/app.js';
          const response = await fetch(`https://raw.githubusercontent.com/DatomerAB/par-releases/main/downloads.json?run=${process.env.GITHUB_RUN_ID}`, { signal: AbortSignal.timeout(30000) });
          if (!response.ok) throw new Error('Public catalog is unavailable; keeping existing downloads');
          const catalog = await response.json();
          if (!validDownloadCatalog(catalog) || !/^[0-9a-f]{64}$/.test(catalog.revision)) throw new Error('Invalid public catalog');
          for (const entry of Object.values(catalog.platforms).flat()) {
            const asset = await fetch(entry.url, { method: 'HEAD', signal: AbortSignal.timeout(30000) });
            if (!asset.ok) throw new Error(`Installer is unavailable: ${entry.name}`);
          }
          const path = 'assets/landing/config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.downloadCatalog = catalog;
          config.downloadCatalogUrl = 'https://raw.githubusercontent.com/DatomerAB/par-releases/main/downloads.json';
          config.downloadUrl = catalog.platforms['macos-arm64']?.[0]?.url || config.downloadUrl || '';
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          const scriptPath = 'assets/landing/app.js';
          const script = fs.readFileSync(scriptPath, 'utf8').replace(/(config\.json\?)[^']*/g, `$1${catalog.revision}`);
          fs.writeFileSync(scriptPath, script);
          JS
          node --test tests/beta-downloads.test.mjs
      - name: Commit beta snapshot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/landing/config.json assets/landing/app.js
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified beta download snapshot'
            git push origin HEAD:main
          fi
      - name: Explicitly deploy GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run static.yml --ref main --repo "$GITHUB_REPOSITORY"
      - name: Verify deployed catalog revision
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const expected = JSON.parse(fs.readFileSync('assets/landing/config.json', 'utf8')).downloadCatalog.revision;
          const deadline = Date.now() + 15 * 60000;
          while (Date.now() < deadline) {
            try {
              const response = await fetch(`https://datomerab.github.io/par-public/assets/landing/config.json?revision=${expected}&run=${Date.now()}`, { signal: AbortSignal.timeout(30000) });
              if (response.ok && (await response.json()).downloadCatalog?.revision === expected) process.exit(0);
            } catch (error) { console.log(error.message); }
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error('GitHub Pages has not deployed the verified beta catalog');
          JS