name: Check Pär content sync

# Validates that par-public's legal attribution stays identical to the
# canonical NOTICE.md generated in the private DatomerAB/Par repository.
# This is a safety net in case a manual edit bypasses the automated sync.

on:
  pull_request:
    paths:
      - "docs/NOTICE.md"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      runner_preference:
        description: "Runner preference"
        type: choice
        default: self-hosted-preferred
        options: [self-hosted-preferred, github-hosted]
      wait_minutes:
        description: "Maximum availability wait (0-30 minutes)"
        type: number
        default: 30

jobs:
  runner-selection:
    uses: DatomerAB/par-releases/.github/workflows/select-runner.yml@aeee4650b4ff862003a297cec42cdbf2c17899d5
    with:
      runner_preference: ${{ inputs.runner_preference || vars.RUNNER_PREFERENCE || 'self-hosted-preferred' }}
      self_hosted_labels: '["self-hosted","macOS","ARM64","par"]'
      github_hosted_label: ubuntu-latest
      wait_minutes: ${{ fromJSON(github.event.inputs.wait_minutes || vars.RUNNER_WAIT_MINUTES || '30') }}
    secrets:
      runner_check_token: ${{ secrets.SELF_HOSTED_RUNNER_CHECK_TOKEN }}
    permissions:
      actions: read

  check-notice:
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - name: Checkout par-public
        uses: actions/checkout@v4

      - name: Fetch canonical NOTICE from Pär
        env:
          # DatomerAB/Par is private, so the repo-scoped GITHUB_TOKEN cannot read it.
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/par-canonical"
          gh api repos/DatomerAB/Par/contents/NOTICE.md \
            --jq '.content' \
            | base64 -d > "$RUNNER_TEMP/par-canonical"/NOTICE.md

      - name: Compare NOTICE.md
        run: |
          set -euo pipefail
          diff -u "$RUNNER_TEMP/par-canonical"/NOTICE.md docs/NOTICE.md
          echo "✅ par-public/docs/NOTICE.md matches Pär/NOTICE.md"
