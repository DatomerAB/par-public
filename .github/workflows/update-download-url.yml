name: Update landing page download URL

on:
  repository_dispatch:
    types:
      - release-published
  workflow_dispatch:
    inputs:
      runner_preference:
        description: "Runner preference"
        type: choice
        default: self-hosted-preferred
        options: [self-hosted-preferred, github-hosted]
      wait_minutes:
        description: "Maximum availability wait (0-30 minutes)"
        type: number
        default: 30
      tag:
        description: "Release tag (e.g. v0.1.0-beta.2026083101)"
        required: true
        type: string
      dmg_url:
        description: "Direct download URL for the macOS DMG"
        required: true
        type: string

permissions:
  contents: write

jobs:
  runner-selection:
    uses: DatomerAB/par-releases/.github/workflows/select-runner.yml@aeee4650b4ff862003a297cec42cdbf2c17899d5
    with:
      runner_preference: ${{ inputs.runner_preference || vars.RUNNER_PREFERENCE || 'self-hosted-preferred' }}
      self_hosted_labels: '["self-hosted","macOS","ARM64","par"]'
      github_hosted_label: ubuntu-latest
      wait_minutes: ${{ fromJSON(github.event.inputs.wait_minutes || vars.RUNNER_WAIT_MINUTES || '30') }}
    secrets:
      runner_check_token: ${{ secrets.SELF_HOSTED_RUNNER_CHECK_TOKEN }}
    permissions:
      actions: read

  update:
    needs: runner-selection
    runs-on: ${{ fromJSON(needs.runner-selection.outputs.runs_on) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a PAT if branch protection prevents GITHUB_TOKEN pushes.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update config.json
        shell: bash
        env:
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          DMG_URL: ${{ github.event.client_payload.dmg_url || inputs.dmg_url }}
        run: |
          set -euo pipefail

          if [[ -z "$TAG" ]]; then
            echo "❌ Missing required input: tag"
            exit 1
          fi

          if [[ -z "$DMG_URL" ]]; then
            echo "❌ Missing required input: dmg_url"
            exit 1
          fi

          CONFIG_PATH="assets/landing/config.json"
          APP_JS_PATH="assets/landing/app.js"
          if [[ ! -f "$CONFIG_PATH" ]]; then
            echo "❌ Config file not found: $CONFIG_PATH"
            exit 1
          fi
          if [[ ! -f "$APP_JS_PATH" ]]; then
            echo "❌ App JS file not found: $APP_JS_PATH"
            exit 1
          fi

          # Validate that the download URL is reachable before committing.
          HTTP_STATUS=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$DMG_URL" || true)
          if [[ "$HTTP_STATUS" != "200" && "$HTTP_STATUS" != "302" && "$HTTP_STATUS" != "307" ]]; then
            echo "❌ DMG URL is not reachable (HTTP $HTTP_STATUS): $DMG_URL"
            exit 1
          fi

          # Preserve other keys in config.json and update downloadUrl.
          jq --arg url "$DMG_URL" '.downloadUrl = $url' "$CONFIG_PATH" > "$CONFIG_PATH.tmp"
          mv "$CONFIG_PATH.tmp" "$CONFIG_PATH"

          # Bust the GitHub Pages CDN cache for config.json by rewriting the
          # release tag in the fetch path. This guarantees visitors see the
          # latest download URL immediately after a release.
          # Matches whatever currently follows `config.json?` rather than a
          # one-shot placeholder, so it keeps working on every later release.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' -E "s|(config\.json\?)[^']*|\1${TAG}|g" "$APP_JS_PATH"
          else
            sed -i -E "s|(config\.json\?)[^']*|\1${TAG}|g" "$APP_JS_PATH"
          fi

          if ! grep -q "config.json?${TAG}" "$APP_JS_PATH"; then
            echo "❌ Cache-buster was not rewritten in $APP_JS_PATH."
            echo "   Expected to find: config.json?${TAG}"
            echo "   Current value:"
            grep -n "CONFIG_PATH" "$APP_JS_PATH"
            exit 1
          fi

          echo "✅ Updated $CONFIG_PATH with download URL for $TAG"
          cat "$CONFIG_PATH"
          echo "✅ Busted cache in $APP_JS_PATH"
          grep -n "CONFIG_PATH" "$APP_JS_PATH"

      - name: Commit and push
        shell: bash
        env:
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- assets/landing/config.json assets/landing/app.js; then
            echo "ℹ No changes to commit."
            exit 0
          fi

          git add assets/landing/config.json assets/landing/app.js
          git commit -m "chore: update download URL to $TAG"
          git push origin main
